<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Reviews</title>
<style>
  @font-face { font-family: "DinerPixel"; src: url("dinerpixel.woff") format("woff"); }
  :root { --ink: #3c281e; --red: #d8323c; --teal: #2f9c95; --cream: #f7f1e6; --cream-d: #e4dacb; --paper: #fffdf5;
          --dark: #2b2b38; --yel: #ffc83d; --yel-d: #d39a12; --grey: #8a7a6d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "DinerPixel", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif; color: var(--ink);
    background: var(--cream); background-image: linear-gradient(var(--cream-d) 2px, transparent 2px), linear-gradient(90deg, var(--cream-d) 2px, transparent 2px);
    background-size: 32px 32px; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: none; }
  img { image-rendering: pixelated; }
  button { font: inherit; color: inherit; cursor: pointer; border: 3px solid var(--ink); background: #fff; }

  /* ---------- top bar ---------- */
  .bar { background: var(--dark); color: #fff; display: flex; align-items: center; gap: 18px; padding: 10px 20px; flex: none; }
  .bar h1 { font-size: 40px; font-weight: normal; flex: 1; display: flex; align-items: center; gap: 14px; }
  .bar h1 img { width: 40px; height: 40px; }
  .bar button { font-size: 20px; padding: 8px 14px 6px; background: #45455a; color: #fff; border-color: #6a6a80; }
  .bar button.go { background: var(--yel); color: var(--ink); border-color: var(--ink); }
  .bar button.armed { background: var(--red); border-color: var(--red); }
  .checker { flex: none; height: 6px; box-sizing: content-box; border-top: 3px solid var(--teal); border-bottom: 3px solid var(--teal);
    background: repeating-conic-gradient(var(--red) 0 25%, #fff 0 50%) 0 0 / 12px 12px; }

  .main { flex: 1; display: flex; min-height: 0; }

  /* ---------- left: the camera ---------- */
  .side { width: 330px; flex: none; padding: 18px; display: flex; flex-direction: column; gap: 14px; border-right: 4px solid var(--ink); background: var(--paper); }
  .side h2 { font-size: 30px; font-weight: normal; text-align: center; }
  .cam { position: relative; border: 4px solid var(--ink); background: #222; aspect-ratio: 4 / 3; overflow: hidden; }
  .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .cam .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 20px; text-align: center; padding: 14px; }
  .cam .frame { position: absolute; inset: 14%; border: 4px dashed rgba(255,255,255,.7); pointer-events: none; }
  .cam.hit { border-color: #3bb36b; }
  .cam.hit .frame { border: 6px solid #3bb36b; }
  .hint { font-size: 20px; text-align: center; color: var(--grey); line-height: 1.4; }
  .count { font-size: 20px; text-align: center; margin-top: auto; }
  .count b { font-size: 40px; font-weight: normal; color: var(--red); display: block; }

  /* ---------- right: restaurant cards ---------- */
  .board { flex: 1; overflow: auto; padding: 20px; }
  .empty { font-size: 30px; color: var(--grey); text-align: center; margin-top: 18vh; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
  .card { background: var(--paper); border: 4px solid var(--ink); box-shadow: 6px 6px 0 rgba(60,40,30,.2); position: relative; display: flex; flex-direction: column; }
  .card.new { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  .rank { position: absolute; top: -12px; left: -12px; width: 44px; height: 44px; display: grid; place-items: center; font-size: 30px;
    background: #fff; border: 3px solid var(--ink); z-index: 2; }
  .rank.r1 { background: var(--yel); } .rank.r2 { background: #d9dde3; } .rank.r3 { background: #e7b98a; }
  .sign { padding: 12px 12px 10px 40px; text-align: center; font-size: 30px; line-height: 1.15; word-break: break-word; min-height: 66px; display: grid; place-items: center; }
  .sign.diner { background: var(--dark); color: #fff; text-shadow: 0 0 6px #ff4f8b, 0 0 14px #ff4f8b; border-bottom: 4px solid #ff4f8b; }
  .sign.cafe { background: #2f3d35; color: #f6f1e3; border-bottom: 6px solid #a0703f; }
  .sign.japan { background: #2d3a63; color: #fff; border-top: 6px solid #6b4226; }
  .body { padding: 12px 14px 14px; display: flex; gap: 12px; align-items: center; flex: 1; }
  .body .dish { width: 64px; height: 64px; flex: none; }
  .score { flex: 1; }
  .avg { font-size: 40px; line-height: 1; }
  .avg small { font-size: 20px; color: var(--grey); }
  .stars { display: flex; gap: 2px; margin: 6px 0; }
  .stars img { width: 24px; height: 24px; }
  .stars img.off { opacity: .2; filter: grayscale(1); }
  .quote { font-size: 20px; color: var(--teal); line-height: 1.2; }
  /* few restaurants: bigger cards for the back of the room */
  .grid.big { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }
  .big .sign { font-size: 40px; min-height: 84px; }
  .big .body .dish { width: 96px; height: 96px; }
  .big .avg { font-size: 60px; }
  .big .avg small { font-size: 30px; }
  .big .stars img { width: 32px; height: 32px; }
  .big .quote { font-size: 30px; }

  /* ---------- scan flash ---------- */
  .flash { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; z-index: 20;
    background: #3bb36b; color: #fff; border: 5px solid var(--ink); padding: 18px 34px 14px; font-size: 40px; text-align: center; box-shadow: 8px 8px 0 rgba(0,0,0,.3); }
  .flash.show { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }
  .flash small { display: block; font-size: 20px; margin-top: 6px; }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(30,25,35,.88); display: none; align-items: center; justify-content: center; z-index: 30; }
  .overlay.show { display: flex; }
  .panel { background: var(--paper); border: 5px solid var(--ink); padding: 26px; width: min(560px, 92vw); text-align: center; }
  .panel h3 { font-size: 30px; font-weight: normal; margin-bottom: 16px; }
  .panel input { width: 100%; font: inherit; font-size: 30px; padding: 10px 12px; border: 3px solid var(--ink); margin-bottom: 16px; }
  .pick { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .pick button { width: 64px; height: 64px; display: grid; place-items: center; background: #f0ebe4; }
  .pick button img { width: 40px; height: 40px; opacity: .25; filter: grayscale(1); }
  .pick button.on { background: var(--yel); } .pick button.on img { opacity: 1; filter: none; }
  .row { display: flex; gap: 12px; justify-content: center; }
  .row button { font-size: 30px; padding: 10px 22px 8px; }
  .row button.go { background: var(--yel); }

  /* Restaurant of the Day */
  #winOv { flex-direction: column; color: #fff; overflow: hidden; background: rgba(25,20,30,.96); }
  .win-title { font-size: 40px; color: var(--yel); letter-spacing: 4px; margin-bottom: 26px; }
  .win-name { font-size: 80px; line-height: 1.1; text-align: center; padding: 0 30px; min-height: 100px; }
  .win-name.done { animation: pop .7s ease-out; color: #fff; text-shadow: 0 0 10px var(--yel), 0 0 30px var(--yel); }
  .win-stars { display: flex; gap: 8px; margin-top: 24px; min-height: 64px; }
  .win-stars img { width: 64px; height: 64px; }
  .win-sub { font-size: 30px; margin-top: 16px; color: #ddd; min-height: 40px; }
  .confetti { position: absolute; top: -20px; width: 14px; height: 14px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>

<div class="bar">
  <h1><img src="star.png" alt="">Restaurant Reviews</h1>
  <button id="addBtn">+ Add by hand</button>
  <button id="clearBtn">Clear board</button>
  <button class="go" id="winBtn">Restaurant of the Day!</button>
</div>
<div class="checker"></div>

<div class="main">
  <aside class="side">
    <h2>Scan here!</h2>
    <div class="cam" id="cam"><video id="video" playsinline muted></video><div class="frame"></div><div class="msg" id="camMsg">Starting camera...</div></div>
    <p class="hint">Tap <b>Results</b> on your iPad.<br>Hold the QR code up to the camera.</p>
    <p class="count"><b id="countNum">0</b>restaurants</p>
  </aside>
  <section class="board" id="board"></section>
</div>

<div class="flash" id="flash"></div>
<canvas id="canvas" hidden></canvas>

<!-- add by hand -->
<div class="overlay" id="addOv">
  <div class="panel">
    <h3>Add a restaurant by hand</h3>
    <input id="addName" maxlength="24" placeholder="Restaurant name" autocomplete="off">
    <div class="pick" id="addStars"></div>
    <div class="row"><button id="addCancel">Cancel</button><button class="go" id="addOk">Add</button></div>
  </div>
</div>

<!-- restaurant of the day -->
<div class="overlay" id="winOv">
  <div class="win-title">RESTAURANT OF THE DAY</div>
  <div class="win-name" id="winName"></div>
  <div class="win-stars" id="winStars"></div>
  <div class="win-sub" id="winSub"></div>
</div>

<script src="lib/jsQR.js"></script>
<script>
// Must match the list in index.html (same order).
const PHRASES = ["It's delicious!", "I like this restaurant!", "Good price!", "Nice menu!",
                 "Great service!", "I want to come again!", "Yummy!", "Too expensive!"];
const STYLES = ["diner", "cafe", "japan"];
const MIN_REVIEWS_TO_WIN = 3;    // Restaurant of the Day needs at least this many reviews (if anyone has that many)
const KEY = "robertsensei-reviewboard-v1";

const $ = id => document.getElementById(id);
let places = {};                  // id -> {id, name, style, dish, stars:[...], phrases:[...], at}
try { places = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(places)); } catch (e) {} };

const avgOf = p => p.stars.length ? p.stars.reduce((a, b) => a + b, 0) / p.stars.length : 0;
const sorted = () => Object.values(places).sort((a, b) => avgOf(b) - avgOf(a) || b.stars.length - a.stars.length || a.at - b.at);
const starRow = (avg, cls = "") => [1, 2, 3, 4, 5].map(i => `<img src="star.png" class="${i <= Math.round(avg) ? "" : "off"}" alt="">`).join("");
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function topPhrase(p) {
  const c = {}; p.phrases.forEach(x => c[x] = (c[x] || 0) + 1);
  const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return best ? PHRASES[best[0]] : "";
}

// ------------------------------------------------------------------
//  draw the board (cards slide to their new places when the ranking changes)
// ------------------------------------------------------------------
function render(newId) {
  const list = sorted();
  $("countNum").textContent = list.length;
  if (!list.length) {
    $("board").innerHTML = `<p class="empty">No restaurants yet.<br>Scan your QR code!</p>`;
    return;
  }
  const before = {};
  document.querySelectorAll(".card").forEach(c => before[c.dataset.id] = c.getBoundingClientRect());
  const big = list.length <= 6 && window.innerWidth >= 1200;
  $("board").innerHTML = `<div class="grid${big ? " big" : ""}">` + list.map((p, i) => {
    const avg = avgOf(p), n = p.stars.length;
    const rank = i + 1 - list.slice(0, i).filter(q => avgOf(q) === avg && q.stars.length === n).length;
    const quote = topPhrase(p);
    return `<div class="card${p.id === newId ? " new" : ""}" data-id="${esc(p.id)}">
      <div class="rank${rank <= 3 ? " r" + rank : ""}">${rank}</div>
      <div class="sign ${STYLES.includes(p.style) ? p.style : "diner"}">${esc(p.name)}</div>
      <div class="body">
        ${p.dish ? `<img class="dish" src="food/${esc(p.dish)}.png" alt="">` : ""}
        <div class="score">
          <div class="avg">${n ? avg.toFixed(1) : "-"} <small>${n} review${n === 1 ? "" : "s"}</small></div>
          <div class="stars">${starRow(avg)}</div>
          ${quote ? `<div class="quote">"${esc(quote)}"</div>` : ""}
        </div>
      </div></div>`;
  }).join("") + `</div>`;
  // FLIP: animate cards that moved
  document.querySelectorAll(".card").forEach(c => {
    const old = before[c.dataset.id]; if (!old || c.dataset.id === newId) return;
    const now = c.getBoundingClientRect();
    const dx = old.left - now.left, dy = old.top - now.top;
    if (!dx && !dy) return;
    c.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 500, easing: "ease-out" });
  });
  const fresh = newId && document.querySelector(`.card[data-id="${CSS.escape(newId)}"]`);
  if (fresh) fresh.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ------------------------------------------------------------------
//  sounds (made in the browser, no files needed)
// ------------------------------------------------------------------
let audio;
function tone(freq, start, dur, type = "square", vol = .08) {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
  const t = audio.currentTime + start;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.start(t); o.stop(t + dur);
}
const beep = () => { tone(880, 0, .12); tone(1320, .1, .25); };
const fanfare = () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .14, i === 5 ? .7 : .2, "square", .07));
const tick = () => tone(600, 0, .05, "square", .04);

// ------------------------------------------------------------------
//  adding a restaurant (from a QR code or by hand)
// ------------------------------------------------------------------
function addPlace(p, label) {
  const isNew = !places[p.id];
  places[p.id] = Object.assign({ at: Date.now() }, places[p.id] || {}, p);
  save(); render(p.id); beep();
  const f = $("flash");
  f.innerHTML = `${isNew ? "Welcome" : "Updated"}!<small>${esc(p.name)} - ${p.stars.length ? avgOf(p).toFixed(1) + " stars" : "no reviews yet"}</small>`;
  f.classList.remove("show"); void f.offsetWidth; f.classList.add("show");
}
// QR text: RD1|id|style|name|dish|stars|phrases
function parseCode(text) {
  const parts = text.split("|");
  if (parts.length !== 7 || parts[0] !== "RD1") return null;
  const [, id, style, name, dish, stars, phrases] = parts;
  if (!/^[a-z0-9]{1,12}$/.test(id) || !/^[1-5]*$/.test(stars) || !/^[0-9]*$/.test(phrases)) return null;
  return { id, style, name: name || "My Restaurant", dish: /^[a-z_]{1,20}$/.test(dish) ? dish : "",
           stars: [...stars].map(Number), phrases: [...phrases].map(Number).filter(n => n < PHRASES.length) };
}

// ------------------------------------------------------------------
//  camera + QR scanning
// ------------------------------------------------------------------
const lastSeen = {};
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $("video"); v.srcObject = stream; await v.play();
    $("camMsg").style.display = "none";
    scanLoop(v);
  } catch (e) {
    $("camMsg").innerHTML = (e.name === "NotAllowedError" ? "Camera blocked.<br>Allow the camera and reload." :
                             e.name === "NotFoundError" ? "No camera found." : "Camera error:<br>" + e.name) +
                            "<br><br>Use + Add by hand.";
  }
}
function scanLoop(v) {
  const c = $("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
  let last = 0;
  (function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < 120 || v.readyState < 2) return;     // about 8 scans a second is plenty
    last = t;
    const w = 640, h = Math.round(640 * v.videoHeight / v.videoWidth);
    c.width = w; c.height = h; ctx.drawImage(v, 0, 0, w, h);
    const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
    if (!code) return;
    if (document.querySelector(".overlay.show")) return;   // paused while a popup is open
    const p = parseCode(code.data);
    if (!p) return;
    const key = p.id + p.stars.length;
    if (lastSeen[key] && Date.now() - lastSeen[key] < 5000) return;   // same code still in front of the camera
    lastSeen[key] = Date.now();
    $("cam").classList.add("hit"); setTimeout(() => $("cam").classList.remove("hit"), 800);
    addPlace(p);
  })(0);
}

// ------------------------------------------------------------------
//  add by hand (if the camera doesn't work)
// ------------------------------------------------------------------
let handStars = 0;
for (let i = 1; i <= 5; i++) {
  const b = document.createElement("button"); b.innerHTML = `<img src="star.png" alt="">`;
  b.onclick = () => { handStars = i; $("addStars").querySelectorAll("button").forEach((x, j) => x.classList.toggle("on", j < i)); };
  $("addStars").appendChild(b);
}
$("addBtn").onclick = () => { $("addName").value = ""; handStars = 0; $("addStars").querySelectorAll("button").forEach(x => x.classList.remove("on"));
  $("addOv").classList.add("show"); $("addName").focus(); };
$("addCancel").onclick = () => $("addOv").classList.remove("show");
$("addOk").onclick = () => {
  const name = $("addName").value.trim(); if (!name || !handStars) return;
  $("addOv").classList.remove("show");
  addPlace({ id: "hand" + Math.random().toString(36).slice(2, 7), style: "diner", name, dish: "", stars: [handStars], phrases: [] });
};

// ------------------------------------------------------------------
//  clear (tap twice)
// ------------------------------------------------------------------
$("clearBtn").onclick = () => {
  const b = $("clearBtn");
  if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Tap again to clear"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "Clear board"; }, 3000); return; }
  places = {}; save(); render();
  b.classList.remove("armed"); b.textContent = "Clear board";
};

// ------------------------------------------------------------------
//  Restaurant of the Day: drumroll, then the winner
// ------------------------------------------------------------------
$("winBtn").onclick = () => {
  const all = sorted().filter(p => p.stars.length);
  if (!all.length) return;
  const enough = all.filter(p => p.stars.length >= MIN_REVIEWS_TO_WIN);
  const pool = enough.length ? enough : all;
  const winner = pool[0];
  const ov = $("winOv"); ov.classList.add("show");
  ["winStars", "winSub"].forEach(id => $(id).innerHTML = "");
  $("winName").className = "win-name";
  let i = 0, delay = 60;
  (function spin() {
    $("winName").textContent = all[i++ % all.length].name; tick();
    delay *= 1.12;
    if (delay < 420) return setTimeout(spin, delay);
    setTimeout(() => {
      $("winName").textContent = winner.name; $("winName").className = "win-name done";
      $("winStars").innerHTML = starRow(avgOf(winner));
      $("winSub").textContent = `${avgOf(winner).toFixed(1)} stars from ${winner.stars.length} reviews`;
      fanfare(); confetti();
    }, 300);
  })();
};
$("winOv").onclick = () => { if ($("winName").classList.contains("done")) { $("winOv").classList.remove("show"); document.querySelectorAll(".confetti").forEach(c => c.remove()); } };
function confetti() {
  const colours = ["#ffc83d", "#d8323c", "#2f9c95", "#ff4f8b", "#3fc8ff", "#fff"];
  for (let k = 0; k < 90; k++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw"; d.style.background = colours[k % colours.length];
    d.style.animationDuration = 2.5 + Math.random() * 2.5 + "s"; d.style.animationDelay = Math.random() * .8 + "s";
    $("winOv").appendChild(d);
  }
}

window.addEventListener("resize", () => render());
render();
startCamera();
</script>
</body>
</html>
